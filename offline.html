<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Iqra - Mode Offline</title>
  <style>
    :root {
      --background: #F6F4EE;
      --surface: #FFFFFF;
      --primary: #1E6B57;
      --text-primary: #17302A;
      --text-secondary: #5E726B;
      --border: #E1DDD0;
      --accent: #B38B3A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0D1613;
        --surface: #15211D;
        --primary: #4FB596;
        --text-primary: #E9F0ED;
        --text-secondary: #9DB0A9;
        --border: #26362F;
        --accent: #D2AE5E;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--background);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(23,48,42,0.06);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: var(--background);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      min-height: 44px;
      width: 100%;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Anda Sedang Offline</h1>
    <p>Halaman ini belum tersimpan di memori perangkat. Silakan hubungkan kembali perangkat ke internet atau buka halaman yang telah dibuka sebelumnya seperti Al-Qur'an dan Jadwal Sholat.</p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">Coba Muat Ulang</a>
  </div>
</body>
</html>
